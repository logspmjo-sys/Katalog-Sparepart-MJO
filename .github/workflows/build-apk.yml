name: Build APK Katalog Sparepart MJO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Siapkan Folder Web, Capacitor, dan Ikon
        run: |
          mkdir -p www assets
          cp *.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/local-notifications
          npx cap init "Katalog Sparepart MJO" "com.sparepart.mjo" --web-dir www
          npx cap add android
          npx cap sync android
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              txt = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />"""
          txt = txt.replace("<application", perms + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(txt)
          '
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          fi
          echo 'configurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }' >> android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Katalog Sparepart MJO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Katalog Sparepart MJO
          path: android/app/build/outputs/apk/debug/Katalog Sparepart MJO.apk
