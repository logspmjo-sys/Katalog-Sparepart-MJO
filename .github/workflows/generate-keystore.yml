name: Generate Keystore MJO (Sekali Saja)

on:
  workflow_dispatch:

jobs:
  make-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate mjo-release.jks & Base64
        run: |
          keytool -genkeypair -v \
            -keystore mjo-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias mjo_key \
            -storepass SparoMJO2026 \
            -keypass SparoMJO2026 \
            -dname "CN=Warehouse & Engineering MJO, OU=RMPM & Sparepart, O=PT SGS, L=Mojosari, ST=Jawa Timur, C=ID"
          base64 -w 0 mjo-release.jks > keystore-base64.txt

      - name: Upload Keystore & Base64
        uses: actions/upload-artifact@v4
        with:
          name: MJO-Keystore-Bundle
          path: |
            mjo-release.jks
            keystore-base64.txt
